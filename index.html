<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Brewiq</title>
</head>
<body>

<h1>📊 Dashboard Reviews</h1>

<div id="reviews"></div>

<script>
let D = { reviews: [] };

function buildReviews(){
  const container = document.getElementById("reviews");
  container.innerHTML = "";

  D.reviews.forEach(r=>{
    const div = document.createElement("div");
    div.style.border = "1px solid #ccc";
    div.style.margin = "10px";
    div.style.padding = "10px";

    div.innerHTML = `
      <p><strong>Produits:</strong> ${r.kp.join(", ")}</p>
      <p><strong>Avis:</strong> ${r.t}</p>
      <p><strong>Sentiment:</strong> ${r.s}</p>
    `;

    container.appendChild(div);
  });
}

function loadReviewsFromLocal(){
  const data = JSON.parse(localStorage.getItem("reviews")) || [];

  D.reviews = data.map(r=>({
    t: r.review,
    s: r.rating >=4 ? 'positif' : r.rating <=2 ? 'négatif' : 'neutre',
    kp: r.products || []
  }));

  buildReviews();
}

loadReviewsFromLocal();
</script>

</body>
</html>
