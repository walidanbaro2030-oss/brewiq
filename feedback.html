<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Feedback Client</title>
</head>
<body>

<h1>⭐ Donnez votre avis</h1>

<h3>Produits achetés :</h3>

<label><input type="checkbox" value="Espresso"> Espresso</label><br>
<label><input type="checkbox" value="Latte"> Latte</label><br>
<label><input type="checkbox" value="Cappuccino"> Cappuccino</label><br>

<h3>Rating :</h3>
<select id="rating">
  <option value="5">⭐⭐⭐⭐⭐</option>
  <option value="4">⭐⭐⭐⭐</option>
  <option value="3">⭐⭐⭐</option>
  <option value="2">⭐⭐</option>
  <option value="1">⭐</option>
</select>

<h3>Votre avis :</h3>
<textarea id="avis"></textarea><br><br>

<button onclick="submitForm()">Envoyer</button>

<script>
function submitForm(){
  const products = [...document.querySelectorAll('input:checked')].map(p=>p.value);
  const avis = document.getElementById('avis').value;
  const rating = parseInt(document.getElementById('rating').value);

  const review = {
    products: products,
    rating: rating,
    review: avis,
    date: new Date()
  };

  let reviews = JSON.parse(localStorage.getItem("reviews")) || [];

  reviews.push(review);

  localStorage.setItem("reviews", JSON.stringify(reviews));

  alert("Merci pour votre avis !");
}
</script>

</body>
</html>
