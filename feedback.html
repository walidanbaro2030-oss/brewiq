<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>BrewIQ Feedback</title>
<style>
body{
  font-family: Arial;
  background:#f5f5f5;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  background:#fff;
  padding:20px;
  border-radius:10px;
  width:350px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h2{text-align:center;}

.products label{
  display:block;
  margin:5px 0;
}

.stars span{
  font-size:25px;
  cursor:pointer;
}

textarea{
  width:100%;
  margin-top:10px;
  padding:8px;
}

button{
  margin-top:10px;
  width:100%;
  padding:10px;
  background:#C8773E;
  color:white;
  border:none;
  border-radius:5px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
<h2>☕ Avis Client</h2>

<p>Quels produits avez-vous consommé ?</p>

<div class="products">
<label><input type="checkbox" value="Latte"> Latte</label>
<label><input type="checkbox" value="Americano"> Americano</label>
<label><input type="checkbox" value="Cappuccino"> Cappuccino</label>
<label><input type="checkbox" value="Espresso"> Espresso</label>
<label><input type="checkbox" value="Hot Chocolate"> Hot Chocolate</label>
</div>

<p>Note :</p>
<div class="stars" id="stars">
<span onclick="rate(1)">⭐</span>
<span onclick="rate(2)">⭐</span>
<span onclick="rate(3)">⭐</span>
<span onclick="rate(4)">⭐</span>
<span onclick="rate(5)">⭐</span>
</div>

<textarea id="avis" placeholder="Votre avis..."></textarea>

<button onclick="submitForm()">Envoyer</button>

</div>

<script>
let rating = 0;

function rate(n){
  rating = n;
  alert("Rating: " + n + "⭐");
}

function submitForm(){
  const products = [...document.querySelectorAll('input:checked')].map(p=>p.value);
  const avis = document.getElementById('avis').value;

  console.log({
    products,
    rating,
    avis
  });

  alert("Merci pour votre avis !");
}
</script>

</body>
</html>
